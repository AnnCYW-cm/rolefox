name: Bug report
description: Report a reproducible problem without sharing personal data.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: "Do not upload real resumes, chat screenshots, cookies, tokens, or other personal data."
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use synthetic or sanitized data only.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: dry_run
    attributes:
      label: Was dry-run enabled?
      options:
        - "Yes"
        - "No"
        - "Unknown"
    validations:
      required: true
  - type: checkboxes
    id: sanitized
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed all credentials and personal data from this report.
          required: true
